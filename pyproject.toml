[project]
name = "sql-db-mcp"
version = "0.1.0"
description = "An example of how to set up and deploy an MCP server (in this case, for querying a PostgreSQL database)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Alexander Nestor Bergmann"},
]
dependencies = [
    "mcp[cli]>=1.3.0",
    "sqlalchemy>=2.0.0",
    "psycopg[pool]",
    "asyncpg",
    "python-dotenv>=0.20.0",
]

[project.urls]
Repository = "https://github.com/Alexander-Nestor-Bergmann/agents-mcp-demo"

[tool.uv]
dev-dependencies = [
    "pytest",
    "ruff",
]

[tool.ruff]
select = ["E", "F", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
line-length = 88
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*" 